name: Windows verification

on:
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
      - ".github/workflows/windows-release.yml"
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend, Rust, and packaging checks
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # Full immutable SHAs are intentional. Review and update them explicitly.
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Enable the pinned package manager
        shell: pwsh
        working-directory: windows
        run: |
          corepack enable
          corepack pnpm --version

      - name: Install locked frontend dependencies
        shell: pwsh
        working-directory: windows
        run: corepack pnpm install --frozen-lockfile --trust-lockfile

      - name: Verify frontend, Rust, and offline packaging configuration
        shell: pwsh
        working-directory: windows
        run: |
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          cargo fmt --manifest-path .\src-tauri\Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path .\src-tauri\Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path .\src-tauri\Cargo.toml
          .\scripts\verify-packaging.ps1
