name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36-ext19
            build-tools;36.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Android project
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          lintDebug
          assembleDebug
          --stacktrace

      - name: Verify Room schemas are committed
        run: git diff --exit-code -- app/schemas

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeskCubby-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/DeskCubby.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DeskCubby-android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload generated Room schemas on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DeskCubby-room-schemas-${{ github.sha }}
          path: android/app/schemas/**
          if-no-files-found: error
          retention-days: 7

  migration-test:
    name: Room 15 to 16 migration on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36-ext19
            build-tools;36.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Run Room migration instrumentation test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          working-directory: ./android
          script: >-
            ./gradlew --no-daemon connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.deskcubby.app.data.local.AppDatabase15To16MigrationTest
            --stacktrace

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DeskCubby-instrumentation-reports-${{ github.sha }}
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 7
