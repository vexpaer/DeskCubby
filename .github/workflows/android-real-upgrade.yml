name: Android Real Upgrade

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-real-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-real-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade 0.22.0 APK with v15 data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define fixture paths
        run: |
          echo "OLD_WORKTREE=$RUNNER_TEMP/deskcubby-old" >> "$GITHUB_ENV"
          echo "V15_DATABASE=$RUNNER_TEMP/deskcubby-v15.db" >> "$GITHUB_ENV"
          echo "UPGRADE_REPORT=$RUNNER_TEMP/deskcubby-real-upgrade.txt" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36-ext19
            build-tools;36.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build current app and instrumentation APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Build released 0.22.0 debug APK
        run: |
          git worktree add --detach "$OLD_WORKTREE" 6578af258169add9f7b08a92e3aaf9c99624ad55
          chmod +x "$OLD_WORKTREE/android/gradlew"
          cd "$OLD_WORKTREE/android"
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Build representative Room v15 database fixture
        run: >-
          python3 android/scripts/create_room15_upgrade_fixture.py
          android/app/schemas/com.deskcubby.app.data.local.AppDatabase/15.json
          "$V15_DATABASE"

      - name: Install old APK and upgrade in place
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          script: bash android/scripts/run_real_upgrade_test.sh

      - name: Upload real-upgrade report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DeskCubby-real-upgrade-${{ github.sha }}
          path: ${{ runner.temp }}/deskcubby-real-upgrade.txt
          if-no-files-found: ignore
          retention-days: 7
