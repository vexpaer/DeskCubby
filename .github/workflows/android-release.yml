name: Android Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "android/app/build.gradle.kts"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release(android): v'))
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: android

    env:
      DESKCUBBY_RELEASE_STORE_FILE: release.keystore
      DESKCUBBY_RELEASE_STORE_PASSWORD: ${{ secrets.DESKCUBBY_RELEASE_STORE_PASSWORD }}
      DESKCUBBY_RELEASE_KEY_ALIAS: ${{ secrets.DESKCUBBY_RELEASE_KEY_ALIAS }}
      DESKCUBBY_RELEASE_KEY_PASSWORD: ${{ secrets.DESKCUBBY_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36-ext19
            build-tools;36.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          test -n "${{ secrets.DESKCUBBY_RELEASE_KEYSTORE_BASE64 }}" || {
            echo "Missing DESKCUBBY_RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          }
          printf '%s' "${{ secrets.DESKCUBBY_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "$DESKCUBBY_RELEASE_STORE_PASSWORD" || { echo "Missing DESKCUBBY_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$DESKCUBBY_RELEASE_KEY_ALIAS" || { echo "Missing DESKCUBBY_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$DESKCUBBY_RELEASE_KEY_PASSWORD" || { echo "Missing DESKCUBBY_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Build release APK
        run: >-
          ./gradlew --no-daemon
          testReleaseUnitTest
          lintRelease
          assembleRelease
          --stacktrace

      - name: Verify APK exists
        shell: bash
        run: test -f app/build/outputs/apk/release/DeskCubby.apk

      - name: Prepare release asset
        id: asset
        shell: bash
        run: |
          PUBLISH=false
          TAG=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
            TAG="$GITHUB_REF_NAME"
            PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
            test -n "$APP_VERSION" || { echo "Unable to read versionName"; exit 1; }
            VERSION="v$APP_VERSION"
            TAG="$VERSION"
            PUBLISH=true
          else
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          ASSET_NAME="DeskCubby-${VERSION}.apk"
          cp app/build/outputs/apk/release/DeskCubby.apk "$ASSET_NAME"
          echo "name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "path=android/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.asset.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.asset.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
